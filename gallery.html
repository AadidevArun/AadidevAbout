<!DOCTYPE html>
<!-- gallery.html: Photo gallery with CSS masonry grid and a pure-JS lightbox. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — Aadidev</title>
  <meta name="description" content="A gallery of moments from cricket, football and DevNation filming days.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Inter:wght@400;500;600;700&family=Oswald:wght@500;700&family=Playfair+Display:wght@600;700&family=Unbounded:wght@600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="assets/images/favicon.png"><link rel="stylesheet" href="css/extra.css"><link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Unbounded:wght@800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/csk.css"></head>
<body data-page="gallery">

  <!-- SECTION: Nav -->
  <header class="site-nav">
    <a href="index.html" class="nav-logo">
      <span class="logo-mark">D</span>
      <span>AADIDEV<span class="logo-sub">DevNation</span></span>
    </a>
    <button class="nav-audio-btn" id="audioToggle" aria-label="Play music">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="5 3 19 12 5 21 5 3"/>
  </svg>
</button>
<audio id="bgAudio" src="indian-song.mp3" loop></audio>
    <nav class="nav-links" aria-label="Primary">
      <a href="index.html" data-page="home">Home</a>
      <a href="about.html" data-page="about">About</a>
      <a href="gallery.html" data-page="gallery">Gallery</a>
    </nav>
    <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </header>
  <div class="nav-mobile-panel">
    <ul>
      <li><a href="index.html" data-page="home">Home</a></li>
      <li><a href="about.html" data-page="about">About</a></li>
      <li><a href="gallery.html" data-page="gallery">Gallery</a></li>
    </ul>
  </div>

  <main>
    <!-- SECTION: Gallery hero -->
    <section class="gallery-hero wrap reveal is-visible">
      <p class="tag">Moments</p>
      <h1>Gallery</h1>
    </section>

    <!-- SECTION: Masonry grid -->
    <!-- Replace these CSS-gradient tiles with <img> tags to add your own photos -->
    <section class="wrap reveal">
      <div class="masonry">
<button class="tile" aria-label="View photo: Trying On New Kit"><img src="assets/gallery/kit.jpg" alt="Me in full cricket kit in a sports shop" class="tile-img" loading="lazy"><span>Trying On New Kit</span></button>
<button class="tile" aria-label="View photo: A Pilot In The Making"><img src="assets/gallery/pilot.jpg" alt="Sitting in the seat of a cockpit simulator" class="tile-img" loading="lazy"><span>A Pilot In The Making</span></button>
<button class="tile" aria-label="View photo: U12 B team — First Match"><img src="assets/gallery/u12b.jpg" alt="In school uniform with my cricket bag at the tram stop" class="tile-img" loading="lazy"><span>U12 B team — First Match</span></button>
<button class="tile" aria-label="View photo: Birthday Party"><img src="assets/gallery/bday.jpg" alt="Standing behind my birthday cake" class="tile-img" loading="lazy"><span>Birthday Party</span></button>
<button class="tile" aria-label="View photo: Pizza!!!!!"><img src="assets/gallery/pizza.jpg" alt="A chicken, mushroom and jalapeño pizza" class="tile-img" loading="lazy"><span>Pizza!!!!!</span></button>
<button class="tile" aria-label="View photo: My Dream"><img src="assets/gallery/dream.jpg" alt="A batter in yellow at Wankhede Stadium" class="tile-img" loading="lazy"><span>My Dream</span></button>
<button class="tile" aria-label="View photo: I got a Meta Quest 3!!!"><img src="assets/gallery/quest3.jpg" alt="Holding my new Meta Quest 3 box" class="tile-img" loading="lazy"><span>I got a Meta Quest 3!!!</span></button>
<button class="tile" aria-label="View photo: Last Day of Primary School"><img src="assets/gallery/lastday.jpg" alt="At the Forestdale gate in a signed shirt" class="tile-img" loading="lazy"><span>Last Day of Primary School</span></button>
<button class="tile" aria-label="View photo: Temu Karate Kid"><img src="assets/gallery/karate.jpg" alt="Karate headband in front of the Karate Kid poster" class="tile-img" loading="lazy"><span>Temu Karate Kid</span></button>
</div>
    </section>
  </main>

  <!-- SECTION: Lightbox -->
  <div class="lightbox" id="lightbox">
  <button class="lb-close" aria-label="Close image">&times;</button>
  <button class="lb-prev" aria-label="Previous image">&#10094;</button>
  <div class="lb-image" aria-hidden="true"></div>
  <button class="lb-next" aria-label="Next image">&#10095;</button>
  <p class="lb-caption"></p>
</div>

  <!-- SECTION: Footer -->
  <footer class="site-footer">
    <div class="tricolour-divider"></div>
    <p>Built by Aadidev — DevNation HQ. © 2026<span class="footer-signature">— Aadidev</span></p>
  </footer>

  <script src="js/theme.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/audio.js"></script>
  <!-- <script src="js/loader.js"></script> -->
  <script src="js/konami.js"></script>
</body>
</html>
